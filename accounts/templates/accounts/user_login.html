{% extends 'base.html' %}
{% block head_title %}Login{% endblock %}
{% block content %}
{% include 'form_errors.html' %}
<div class="flex justify-center">
    <div class="w-full md:w-1/2 lg:w-1/3 py-2 px-3 rounded-xl bg-white mt-12">
        <h1 class="font-bold text-3xl text-center pb-5">Login</h1>
        <form method="post" class="shadow-md border border-gray-200 rounded px-8 pt-6 pb-8 mb-4">
            {% csrf_token %}
            {% for field in form %}
                {% include 'form_field.html' %}
            {% endfor %}
            <div class="flex items-center justify-center w-full">
                <button class="bg-blue-900 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="submit">
                    Log In
                </button>
            </div>
        </form>
        <p class="text-center text-sm pb-3">New here? <a class="text-blue-900 font-bold underline" href="{% url 'register' %}">Open an account</a></p>
    </div>
</div>
{% endblock %}
