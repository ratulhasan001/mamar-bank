{% extends 'base.html' %}
{% block head_title %}Change Password{% endblock %}
{% block content %}
{% include 'form_errors.html' %}
<div class="flex justify-center">
    <div class="w-full md:w-1/2 py-2 px-3 rounded-xl bg-white mt-12">
        <h1 class="font-bold text-3xl text-center pb-5">Change Your Password</h1>
        <form method="post" class="shadow-md border border-gray-200 rounded px-8 pt-6 pb-8 mb-4">
            {% csrf_token %}
            {% for field in form %}
                {% include 'form_field.html' %}
            {% endfor %}
            <button type="submit" class="bg-blue-900 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Change Password</button>
        </form>
    </div>
</div>
{% endblock %}
